  "mainEntity": [
    {
      "@type": "Question",
      "name": "Le Diagnostic de Performance Énergétique (DPE) est-il obligatoire pour obtenir MaPrimeRénov' ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cela dépend du parcours. Pour la rénovation d'ampleur MaPrimeRénov', le logement doit être classé E, F ou G et un audit énergétique est obligatoire. Pour les aides par geste (pompe à chaleur, réseau de chaleur), le DPE n'est pas exigé en 2026 : il le deviendra au 1er janvier 2028 (décret n° 2026-822 du 25 août 2026). Un DPE récent reste indispensable pour vendre, louer et calibrer vos travaux."
      }
    },
    {
      "@type": "Question",
      "name": "Quel est le coût moyen d'un audit énergétique complet avec DPE ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le coût d’un audit énergétique complet avec DPE, réalisé par un Accompagnateur Rénov’ agréé, se situe généralement entre 1500 € et 2500 €, en fonction de votre bien."
      }
    },
    {
      "@type": "Question",
      "name": "Quels travaux peuvent améliorer le score DPE de mon logement ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Les travaux les plus efficaces pour améliorer un DPE incluent l'isolation thermique (combles, murs, planchers), le remplacement des menuiseries, la modernisation du système de chauffage, et l'amélioration de la ventilation."
      }
    },
    {
      "@type": "Question",
      "name": "Le DPE permet-il de valoriser mon bien immobilier ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, un meilleur score DPE valorise fortement votre bien sur le marché immobilier. Un logement économe en énergie est plus attractif à la vente ou à la location."
      }
    },
    {
      "@type": "Question",
      "name": "Combien de temps est valable un Diagnostic de Performance Énergétique (DPE) ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le DPE est valable 10 ans, sauf si vous réalisez des travaux importants de rénovation énergétique entre-temps."
      }
    },
    {
      "@type": "Question",
      "name": "Quelles aides financières sont conditionnées par le DPE ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La rénovation d'ampleur MaPrimeRénov' (jusqu'à 80 % des travaux, réservée aux logements E, F ou G) repose sur un audit énergétique et un DPE. L'éco-PTZ « performance globale » (50 000 € sur 20 ans) exige un gain de deux classes. Les CEE et les aides par geste ne dépendent pas encore du DPE, obligatoire pour ces aides à partir de 2028."
      }
    },
    {
      "@type": "Question",
      "name": "Qui peut réaliser un DPE conforme et valable ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le DPE doit être réalisé par un diagnostiqueur certifié, identifié par un QR code et enregistré à l'ADEME (fiabilisation renforcée depuis les décrets de juin 2025). L'audit énergétique et le plan de travaux sont ensuite pilotés par votre Accompagnateur Rénov' agréé : RenoHab vous met en relation avec ces experts."
      }
    },
    {
      "@type": "Question",
      "name": "Puis-je obtenir des aides si mon logement a une étiquette DPE F ou G ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui : la rénovation d'ampleur MaPrimeRénov' est justement réservée aux logements classés E, F ou G, avec une prise en charge de 80 % (ménages très modestes) à 10 % (revenus supérieurs) du montant HT, plafonné à 30 000 ou 40 000 € selon le gain de classes. Les F/G gardent aussi l'accès aux aides par geste (pompe à chaleur) jusqu'au 31 décembre 2027."
      }
    }
  ]
}
